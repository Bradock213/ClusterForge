name: Build ClusterForge Phase 3 Alpha 2 Cross

on:
  push:
    branches:
      - clusterforge-phase3-alpha2-build
    paths:
      - 'phase3-build/**'
      - 'phase3-alpha2-build/**'
      - '.github/workflows/build-clusterforge-phase3-alpha2-cross.yml'
  pull_request:
    paths:
      - 'phase3-build/**'
      - 'phase3-alpha2-build/**'
      - '.github/workflows/build-clusterforge-phase3-alpha2-cross.yml'
  workflow_dispatch:

jobs:
  linux-test-and-windows-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install native and cross-build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libssl-dev libboost-all-dev \
            mingw-w64 zip python3

      - name: Reconstruct verified Phase 3 Alpha 2 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, zipfile

          root = Path.cwd()
          base_parts = sorted((root / 'phase3-build').glob('native.part*.txt'))
          if len(base_parts) != 7:
              raise SystemExit(f'Expected 7 base parts, got {len(base_parts)}')
          clean = lambda text: ''.join(c for c in text if c.isalnum() or c in '+/=')
          base64_text = ''.join(clean(p.read_text()) for p in base_parts)
          base_zip = base64.b64decode(base64_text)
          if hashlib.sha256(base_zip).hexdigest() != '443cb349a365d7600554693f12862a7dfacaeadb24b83fce35596fe796802ad6':
              raise SystemExit('Base archive checksum mismatch')
          Path('phase3-windows-native.zip').write_bytes(base_zip)
          with zipfile.ZipFile('phase3-windows-native.zip') as z:
              z.extractall('source')

          overlay_paths = [
              'phase3-alpha2-build/overlay.part00.txt',
              'phase3-alpha2-build/overlay.part01.txt',
              'phase3-alpha2-build/overlay.part02.txt',
              'phase3-alpha2-build/overlay-fix/part03.00.txt',
              'phase3-alpha2-build/overlay-fix/part03.01.txt',
              'phase3-alpha2-build/overlay-fix/part03.02a.txt',
              'phase3-alpha2-build/overlay-fix/part03.02b.txt',
              'phase3-alpha2-build/overlay-fix/part03.02c.txt',
              'phase3-alpha2-build/overlay-fix/part03.02d.txt',
              'phase3-alpha2-build/overlay-fix/part04.00.txt',
              'phase3-alpha2-build/overlay-fix/part04.01.txt',
              'phase3-alpha2-build/overlay-fix/part04.02.txt',
              'phase3-alpha2-build/overlay.part05.txt',
          ]
          overlay_text = ''.join(clean((root / p).read_text()) for p in overlay_paths)
          overlay_zip = base64.b64decode(overlay_text)
          if hashlib.sha256(overlay_zip).hexdigest() != '2eb5e9e1b66ee58af21b449a4dfdb1f934399a7ea6ba338ef96250d9ba1ac529':
              raise SystemExit('Alpha 2 overlay checksum mismatch')
          Path('phase3-alpha2-overlay.zip').write_bytes(overlay_zip)
          with zipfile.ZipFile('phase3-alpha2-overlay.zip') as z:
              z.extractall('source')

          runtime_parts = sorted((root / 'phase3-alpha2-build/runtime-patch').glob('part*.txt'))
          if len(runtime_parts) != 6:
              raise SystemExit(f'Expected 6 runtime patch parts, got {len(runtime_parts)}')
          patch_b64 = ''.join(clean(p.read_text()) for p in runtime_parts)
          if len(patch_b64) != 10764:
              raise SystemExit(f'Runtime patch text length mismatch: {len(patch_b64)}')
          if hashlib.sha256(patch_b64.encode('ascii')).hexdigest() != 'abf18a3bbae6c5f1794276464ca03e969154e7f4cddafcf7823faaf8f1424d43':
              raise SystemExit('Runtime patch text checksum mismatch')
          patch_gz = base64.b64decode(patch_b64)
          if hashlib.sha256(patch_gz).hexdigest() != 'a81687c435ed171aa3b5b634abbf9bce37dd1c44bf91239ca0e17bc3aca07455':
              raise SystemExit('Runtime patch gzip checksum mismatch')
          Path('runtime.patch').write_bytes(gzip.decompress(patch_gz))
          PY
          cd source/phase3-windows-native
          git apply --check -p2 ../../runtime.patch
          git apply -p2 ../../runtime.patch
          grep -q '0.3.1-phase3-alpha2' src/common.hpp
          test -f src/runtime_ops.cpp

      - name: Build and test native Linux release
        working-directory: source/phase3-windows-native
        run: |
          cmake -S . -B build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLUSTERFORGE_BUILD_TESTS=ON
          cmake --build build/linux --parallel 2
          ctest --test-dir build/linux --output-on-failure

      - name: Prepare vcpkg
        shell: bash
        run: |
          set -euo pipefail
          if [ -x /usr/local/share/vcpkg/vcpkg ]; then
            echo 'VCPKG_ROOT=/usr/local/share/vcpkg' >> "$GITHUB_ENV"
          else
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
            echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          fi

      - name: Cross-build Windows x64 payload with MinGW
        working-directory: source/phase3-windows-native
        shell: bash
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-cache
        run: |
          set -euo pipefail
          "$VCPKG_ROOT/vcpkg" install \
            --triplet x64-mingw-static \
            --x-manifest-root="$PWD"
          cmake -S . -B build/windows-cross -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-mingw-static \
            -DVCPKG_HOST_TRIPLET=x64-linux \
            -DCLUSTERFORGE_BUILD_TESTS=OFF
          cmake --build build/windows-cross --parallel 2

      - name: Verify and package Windows payload
        working-directory: source/phase3-windows-native
        shell: bash
        run: |
          set -euo pipefail
          worker=$(find build/windows-cross -type f -iname 'clusterforge-worker.exe' | head -1)
          watchdog=$(find build/windows-cross -type f -iname 'clusterforge-watchdog.exe' | head -1)
          test -n "$worker" && test -f "$worker"
          test -n "$watchdog" && test -f "$watchdog"
          python3 - "$worker" "$watchdog" <<'PY'
          from pathlib import Path
          import struct, sys
          for name in sys.argv[1:]:
              data = Path(name).read_bytes()
              pe = struct.unpack_from('<I', data, 0x3c)[0]
              if data[pe:pe+4] != b'PE\0\0':
                  raise SystemExit(f'Invalid PE signature: {name}')
              optional = pe + 24
              subsystem = struct.unpack_from('<H', data, optional + 0x44)[0]
              if subsystem != 2:
                  raise SystemExit(f'Not GUI subsystem: {name} subsystem={subsystem}')
          PY
          out=release/windows-x64
          mkdir -p "$out"
          cp "$worker" "$out/ClusterForgeWorker.exe"
          cp "$watchdog" "$out/ClusterForgeWatchdog.exe"
          printf '0.3.1-phase3-alpha2' > "$out/VERSION.txt"
          (cd "$out" && sha256sum ClusterForgeWorker.exe ClusterForgeWatchdog.exe > SHA256.txt)
          (cd "$out" && zip -q -9 ../../ClusterForge-Phase3-Alpha2-Windows-Payload.zip ./*)

      - uses: actions/upload-artifact@v4
        with:
          name: ClusterForge-Phase3-Alpha2-Windows-Payload-Cross
          path: source/phase3-windows-native/ClusterForge-Phase3-Alpha2-Windows-Payload.zip
          retention-days: 7
