name: Build ClusterForge Phase 3 Alpha 2 Windows

on:
  pull_request:
    paths:
      - 'phase3-alpha2-build/**'
      - '.github/workflows/build-clusterforge-phase3-alpha2.yml'
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Locate the missing Alpha 2 overlay character
        shell: pwsh
        run: |
          $s = ((Get-Content 'phase3-alpha2-build/overlay.part04.txt' -Raw) -replace '[^A-Za-z0-9+/=]', '')
          Write-Host "length=$($s.Length)"
          Write-Host "slice10250=$($s.Substring(10250,100))"
          for ($length = 10275; $length -le 10300; $length++) {
            $bytes = [Text.Encoding]::ASCII.GetBytes($s.Substring(0, $length))
            $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
            Write-Host "prefix $length $hash"
          }
          throw 'Character diagnostic complete.'
