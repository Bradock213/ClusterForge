name: Build ClusterForge Phase 3 Alpha 2 Windows

on:
  pull_request:
    paths:
      - 'phase3-alpha2-build/**'
      - '.github/workflows/build-clusterforge-phase3-alpha2.yml'
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose Alpha 2 overlay parts
        shell: pwsh
        run: |
          $parts = Get-ChildItem phase3-alpha2-build/overlay.part*.txt | Sort-Object Name
          Write-Host "part count=$($parts.Count)"
          foreach ($part in $parts) {
            $s = ((Get-Content $part.FullName -Raw) -replace '[^A-Za-z0-9+/=]', '')
            $eq = @()
            for ($i = 0; $i -lt $s.Length; $i++) { if ($s[$i] -eq '=') { $eq += $i } }
            $first = if ($s.Length -ge 16) { $s.Substring(0, 16) } else { $s }
            $last = if ($s.Length -ge 16) { $s.Substring($s.Length - 16) } else { $s }
            Write-Host "$($part.Name) len=$($s.Length) mod4=$($s.Length % 4) equals=$($eq -join ',') first=$first last=$last"
            try {
              $bytes = [Convert]::FromBase64String($s)
              $h = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
              Write-Host "$($part.Name) individualDecodeBytes=$($bytes.Length) sha=$h"
            } catch {
              Write-Host "$($part.Name) individualDecode=FAIL $($_.Exception.Message)"
            }
          }
          $joined = ($parts | ForEach-Object { ((Get-Content $_.FullName -Raw) -replace '[^A-Za-z0-9+/=]', '') }) -join ''
          Write-Host "joined len=$($joined.Length) mod4=$($joined.Length % 4)"
          try {
            $bytes = [Convert]::FromBase64String($joined)
            [IO.File]::WriteAllBytes('joined.zip', $bytes)
            Write-Host "joined bytes=$($bytes.Length) sha=$((Get-FileHash joined.zip -Algorithm SHA256).Hash.ToLowerInvariant())"
          } catch {
            Write-Host "joined decode FAIL $($_.Exception.Message)"
          }
          throw 'Diagnostic run complete.'
