name: Build ClusterForge Phase 3 Alpha 2 Windows

on:
  pull_request:
    paths:
      - 'phase3-build/**'
      - 'phase3-alpha2-build/**'
      - '.github/workflows/build-clusterforge-phase3-alpha2.yml'
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Phase 3 Alpha 1 base source
        shell: pwsh
        run: |
          $parts = Get-ChildItem phase3-build/native.part*.txt | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 base source parts, got $($parts.Count)" }
          $base64 = ($parts | ForEach-Object { ((Get-Content $_.FullName -Raw) -replace '[^A-Za-z0-9+/=]', '') }) -join ''
          [IO.File]::WriteAllBytes('phase3-windows-native.zip', [Convert]::FromBase64String($base64))
          $hash = (Get-FileHash phase3-windows-native.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '443cb349a365d7600554693f12862a7dfacaeadb24b83fce35596fe796802ad6') {
            throw "Base source archive checksum mismatch: $hash"
          }
          Expand-Archive phase3-windows-native.zip -DestinationPath source -Force
          if (-not (Test-Path 'source/phase3-windows-native/CMakeLists.txt')) { throw 'Base source reconstruction failed.' }

      - name: Apply Phase 3 Alpha 2 overlay and runtime manager patch
        shell: pwsh
        run: |
          $orderedParts = @(
            @{ Path = 'phase3-alpha2-build/overlay.part00.txt'; Sha = '7eefd48fe047001adc3194fcc29a265499310411' },
            @{ Path = 'phase3-alpha2-build/overlay.part01.txt'; Sha = '18e938350f860cd93ec7c5fbadc8b8ea7280c426' },
            @{ Path = 'phase3-alpha2-build/overlay.part02.txt'; Sha = '2c9c9a39944dbccca6b7f35a6885c17e8c8c1323' },
            @{ Path = 'phase3-alpha2-build/overlay-fix/part03.00.txt'; Sha = 'a1405c96dd0017e75dc58c6e815117ff222fa2b6' },
            @{ Path = 'phase3-alpha2-build/overlay-fix/part03.01.txt'; Sha = '0ba736a09a5dbb45d9fb96c423d02e2962b232e8' },
            @{ Path = 'phase3-alpha2-build/overlay-fix/part03.02.txt'; Sha = 'eb6056c15c153435d3777f5e0a162599949f9e14' },
            @{ Path = 'phase3-alpha2-build/overlay-fix/part04.00.txt'; Sha = 'f111cc31e0a0cd74bc3cb83a9abc90e0a2453799' },
            @{ Path = 'phase3-alpha2-build/overlay-fix/part04.01.txt'; Sha = 'a93841e6402b6f64511abab90a75f94e6eebd9b4' },
            @{ Path = 'phase3-alpha2-build/overlay-fix/part04.02.txt'; Sha = '096182f653bbbe7c111d3bac63f5be7e498fa046' },
            @{ Path = 'phase3-alpha2-build/overlay.part05.txt'; Sha = '68f621d9322a0f131274ee0e2af39adf247aad04' }
          )
          $segments = foreach ($part in $orderedParts) {
            if (-not (Test-Path $part.Path)) { throw "Missing overlay part: $($part.Path)" }
            $blobSha = (git hash-object $part.Path).Trim().ToLowerInvariant()
            if ($blobSha -ne $part.Sha) { throw "Overlay part checksum mismatch for $($part.Path): $blobSha" }
            ((Get-Content $part.Path -Raw) -replace '[^A-Za-z0-9+/=]', '')
          }
          $base64 = $segments -join ''
          [IO.File]::WriteAllBytes('phase3-alpha2-overlay.zip', [Convert]::FromBase64String($base64))
          $hash = (Get-FileHash phase3-alpha2-overlay.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '2eb5e9e1b66ee58af21b449a4dfdb1f934399a7ea6ba338ef96250d9ba1ac529') {
            throw "Alpha 2 overlay checksum mismatch: $hash"
          }
          Expand-Archive phase3-alpha2-overlay.zip -DestinationPath source -Force

          $patchBase64 = ((Get-Content 'phase3-alpha2-build/runtime.patch.gz.b64' -Raw) -replace '[^A-Za-z0-9+/=]', '')
          [IO.File]::WriteAllBytes('runtime.patch.gz', [Convert]::FromBase64String($patchBase64))
          $input = [IO.File]::OpenRead((Resolve-Path 'runtime.patch.gz'))
          $output = [IO.File]::Create((Join-Path $PWD 'runtime.patch'))
          $gzip = [IO.Compression.GzipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
          try { $gzip.CopyTo($output) } finally { $gzip.Dispose(); $output.Dispose(); $input.Dispose() }

          Push-Location 'source/phase3-windows-native'
          git apply --check -p2 "$env:GITHUB_WORKSPACE/runtime.patch"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime manager patch validation failed.' }
          git apply -p2 "$env:GITHUB_WORKSPACE/runtime.patch"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime manager patch failed.' }
          Pop-Location

          $cmake = Get-Content 'source/phase3-windows-native/CMakeLists.txt' -Raw
          if ($cmake -notmatch 'runtime_ops_test') { throw 'The complete Alpha 2 patch was not applied.' }
          $version = Get-Content 'source/phase3-windows-native/src/common.hpp' -Raw
          if ($version -notmatch '0\.3\.1-phase3-alpha2') { throw 'The source version is not Alpha 2.' }

      - name: Build native Windows x64 payload
        shell: pwsh
        working-directory: source/phase3-windows-native
        run: |
          $env:VCPKG_ROOT = 'C:\vcpkg'
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows-static --x-manifest-root="$PWD"
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg install failed.' }
          cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCLUSTERFORGE_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }
          cmake --build build/windows --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows compilation failed.' }
          ctest --test-dir build/windows -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed.' }

      - name: Verify GUI subsystem and package payload
        shell: pwsh
        working-directory: source/phase3-windows-native
        run: |
          $worker = 'build/windows/bin/Release/clusterforge-worker.exe'
          $watchdog = 'build/windows/bin/Release/clusterforge-watchdog.exe'
          if (-not (Test-Path $worker) -or -not (Test-Path $watchdog)) { throw 'Expected Windows EXEs were not produced.' }

          function Get-PESubsystem([string]$Path) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $Path))
            if ($bytes.Length -lt 256) { throw "PE file is unexpectedly small: $Path" }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($peOffset -lt 0 -or ($peOffset + 256) -gt $bytes.Length) { throw "Invalid PE header offset: $Path" }
            if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45) { throw "Missing PE signature: $Path" }
            $optionalOffset = $peOffset + 24
            $magic = [BitConverter]::ToUInt16($bytes, $optionalOffset)
            if ($magic -ne 0x20b -and $magic -ne 0x10b) { throw "Unknown PE optional-header magic $magic in $Path" }
            return [BitConverter]::ToUInt16($bytes, $optionalOffset + 0x44)
          }

          if ((Get-PESubsystem $worker) -ne 2) { throw 'Worker is not a Windows GUI-subsystem application.' }
          if ((Get-PESubsystem $watchdog) -ne 2) { throw 'Watchdog is not a Windows GUI-subsystem application.' }

          $out = 'release/windows-x64'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item $worker "$out/ClusterForgeWorker.exe"
          Copy-Item $watchdog "$out/ClusterForgeWatchdog.exe"
          '0.3.1-phase3-alpha2' | Set-Content "$out/VERSION.txt" -NoNewline
          Get-FileHash "$out/*.exe" -Algorithm SHA256 | Sort-Object Path | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))"
          } | Set-Content "$out/SHA256.txt"
          Compress-Archive -Path "$out/*" -DestinationPath ClusterForge-Phase3-Alpha2-Windows-Payload.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ClusterForge-Phase3-Alpha2-Windows-Payload
          path: source/phase3-windows-native/ClusterForge-Phase3-Alpha2-Windows-Payload.zip
          retention-days: 7
