name: Refresh current MVP release page

on:
  push:
    branches:
      - main
    paths:
      - 'release-notes/v0.1.0-mvp.md'
      - '.github/workflows/refresh-current-release.yml'

permissions:
  contents: write

jobs:
  refresh-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update v0.1.0-mvp release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v0.1.0-mvp \
            --repo "$GITHUB_REPOSITORY" \
            --title "ClusterForge v0.1.0-mvp" \
            --notes-file release-notes/v0.1.0-mvp.md \
            --prerelease
