name: Cancel stale ClusterForge runs

on:
  push:
    branches:
      - clusterforge-phase3-alpha2-build
    paths:
      - '.github/workflows/cancel-stale-clusterforge-runs.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel all other queued or running workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const current = context.runId;
            for (const status of ['queued', 'in_progress', 'waiting', 'requested', 'pending']) {
              const response = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner,
                repo,
                status,
                per_page: 100
              });
              for (const run of response) {
                if (run.id === current) continue;
                try {
                  await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                  core.info(`Cancelled ${run.id}: ${run.name} (${run.status})`);
                } catch (error) {
                  core.warning(`Could not cancel ${run.id}: ${error.message}`);
                }
              }
            }
