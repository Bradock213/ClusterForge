name: Build ClusterForge Phase 3 Alpha Windows

on:
  pull_request:
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and patch compact Phase 3 Alpha source
        shell: pwsh
        run: |
          $parts = Get-ChildItem phase3-build/native.part*.txt | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 source parts, got $($parts.Count)" }
          $base64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('phase3-windows-native.zip', [Convert]::FromBase64String($base64))
          $hash = (Get-FileHash phase3-windows-native.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '443cb349a365d7600554693f12862a7dfacaeadb24b83fce35596fe796802ad6') {
            throw "Source archive checksum mismatch: $hash"
          }
          Expand-Archive phase3-windows-native.zip -DestinationPath source -Force
          $cmakePath = 'source/phase3-windows-native/CMakeLists.txt'
          if (-not (Test-Path $cmakePath)) { throw 'Source reconstruction failed.' }
          $cmake = Get-Content $cmakePath -Raw
          $cmake = $cmake.Replace('add_executable(clusterforge-worker src/worker_main.cpp)', 'add_executable(clusterforge-worker WIN32 src/worker_main.cpp)')
          $cmake = $cmake.Replace('add_executable(clusterforge-watchdog src/watchdog_main.cpp)', 'add_executable(clusterforge-watchdog WIN32 src/watchdog_main.cpp)')
          $cmake = $cmake.Replace('/SUBSYSTEM:WINDOWS /ENTRY:mainCRTStartup', '/ENTRY:mainCRTStartup')
          Set-Content -Path $cmakePath -Value $cmake -NoNewline

          $workerPath = 'source/phase3-windows-native/src/worker_main.cpp'
          $workerSource = Get-Content $workerPath -Raw
          $workerSource = $workerSource.Replace('    const auto app_directory = std::filesystem::path(std::wstring(module_path.data(), length)).parent_path();', "    const auto bin_directory = std::filesystem::path(std::wstring(module_path.data(), length)).parent_path();`n    const auto install_root = bin_directory.parent_path();")
          $workerSource = $workerSource.Replace('    const auto watchdog = app_directory / "ClusterForgeWatchdog.exe";', '    const auto watchdog = bin_directory / "ClusterForgeWatchdog.exe";')
          $workerSource = $workerSource.Replace('    const auto config = app_directory / "config" / "watchdog-worker.json";', '    const auto config = install_root / "config" / "watchdog-worker.json";')
          $workerSource = $workerSource.Replace('    const auto working = app_directory.wstring();', '    const auto working = install_root.wstring();')
          Set-Content -Path $workerPath -Value $workerSource -NoNewline

      - name: Build native Windows x64 worker and watchdog
        shell: pwsh
        working-directory: source/phase3-windows-native
        run: |
          $env:VCPKG_ROOT = 'C:\vcpkg'
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows-static --x-manifest-root="$PWD"
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg install failed.' }
          cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCLUSTERFORGE_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }
          cmake --build build/windows --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows compilation failed.' }
          ctest --test-dir build/windows -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed.' }

      - name: Verify GUI subsystem
        shell: pwsh
        working-directory: source/phase3-windows-native
        run: |
          $worker = 'build/windows/bin/Release/clusterforge-worker.exe'
          $watchdog = 'build/windows/bin/Release/clusterforge-watchdog.exe'
          if (-not (Test-Path $worker) -or -not (Test-Path $watchdog)) { throw 'Expected EXEs were not produced.' }
          function Get-PESubsystem([string]$Path) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $Path))
            if ($bytes.Length -lt 256) { throw "PE file is unexpectedly small: $Path" }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($peOffset -lt 0 -or ($peOffset + 256) -gt $bytes.Length) { throw "Invalid PE header offset: $Path" }
            if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45) { throw "Missing PE signature: $Path" }
            $optionalOffset = $peOffset + 24
            $magic = [BitConverter]::ToUInt16($bytes, $optionalOffset)
            if ($magic -ne 0x20b -and $magic -ne 0x10b) { throw "Unknown PE optional-header magic $magic in $Path" }
            return [BitConverter]::ToUInt16($bytes, $optionalOffset + 0x44)
          }
          if ((Get-PESubsystem $worker) -ne 2) { throw 'Worker is not linked as a Windows GUI application.' }
          if ((Get-PESubsystem $watchdog) -ne 2) { throw 'Watchdog is not linked as a Windows GUI application.' }

      - name: Build repair and upgrade installer
        shell: pwsh
        working-directory: source/phase3-windows-native
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          @'
          CLUSTERFORGE ALPHA SOFTWARE LICENSE AGREEMENT
          Version 0.3.0 - Phase 3 Alpha 1

          This update is for computers you own or are authorized to administer.
          ClusterForge is alpha software. Keep independent backups.
          It supervises only ClusterForge processes and never power-cycles the laptop.
          Stateful Minecraft/FiveM failover is not enabled in this alpha.
          '@ | Set-Content LICENSE-EULA.txt
          @'
          #define MyAppName "ClusterForge Phase 3 Alpha 1 Repair"
          #define MyAppVersion "0.3.0"

          [Setup]
          AppId={{D38DA3E9-574C-4CC7-A74B-5CB8E3051529}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          DefaultDirName={localappdata}\ClusterForge
          DisableDirPage=yes
          DisableProgramGroupPage=yes
          OutputDir=installer-output
          OutputBaseFilename=ClusterForge-Phase3-Alpha1-Windows-Repair-Setup
          Compression=lzma2/ultra64
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=lowest
          WizardStyle=modern
          LicenseFile=LICENSE-EULA.txt
          Uninstallable=no
          CloseApplications=no
          RestartApplications=no

          [Files]
          Source: "build\windows\bin\Release\clusterforge-worker.exe"; DestDir: "{app}\bin"; DestName: "ClusterForgeWorker.exe"; Flags: ignoreversion
          Source: "build\windows\bin\Release\clusterforge-watchdog.exe"; DestDir: "{app}\bin"; DestName: "ClusterForgeWatchdog.exe"; Flags: ignoreversion

          [Registry]
          Root: HKCU; Subkey: "Software\Microsoft\Windows\CurrentVersion\Run"; ValueType: string; ValueName: "ClusterForge Worker"; ValueData: """{app}\bin\ClusterForgeWatchdog.exe"" --config ""{app}\config\watchdog-worker.json"""; Flags: uninsdeletevalue

          [Icons]
          Name: "{userstartup}\ClusterForge Worker"; Filename: "{app}\bin\ClusterForgeWatchdog.exe"; Parameters: "--config ""{app}\config\watchdog-worker.json"""; WorkingDir: "{app}"
          Name: "{userprograms}\ClusterForge\Start ClusterForge Worker"; Filename: "{app}\bin\ClusterForgeWatchdog.exe"; Parameters: "--config ""{app}\config\watchdog-worker.json"""; WorkingDir: "{app}"
          Name: "{userprograms}\ClusterForge\Open ClusterForge Folder"; Filename: "{app}"

          [Run]
          Filename: "{app}\bin\ClusterForgeWatchdog.exe"; Parameters: "--config ""{app}\config\watchdog-worker.json"""; WorkingDir: "{app}"; Flags: nowait

          [Code]
          function InitializeSetup(): Boolean;
          begin
            Result := FileExists(ExpandConstant('{localappdata}\ClusterForge\config\worker.json')) and
                      FileExists(ExpandConstant('{localappdata}\ClusterForge\config\watchdog-worker.json'));
            if not Result then
              MsgBox('The existing ClusterForge worker configuration was not found. Run the full automatic worker installer first.', mbError, MB_OK);
          end;

          function PrepareToInstall(var NeedsRestart: Boolean): String;
          var
            ResultCode: Integer;
          begin
            Exec(ExpandConstant('{sys}\taskkill.exe'), '/F /IM ClusterForgeWorker.exe', '', SW_HIDE, ewWaitUntilTerminated, ResultCode);
            Exec(ExpandConstant('{sys}\taskkill.exe'), '/F /IM ClusterForgeWatchdog.exe', '', SW_HIDE, ewWaitUntilTerminated, ResultCode);
            Sleep(1000);
            Result := '';
          end;

          procedure CurStepChanged(CurStep: TSetupStep);
          var
            ResultCode: Integer;
            Watchdog, ConfigFile, Params: String;
          begin
            if CurStep = ssPostInstall then
            begin
              Watchdog := ExpandConstant('{app}\bin\ClusterForgeWatchdog.exe');
              ConfigFile := ExpandConstant('{app}\config\watchdog-worker.json');
              Params := '/Create /F /SC ONLOGON /RL LIMITED /TN "ClusterForge Worker" /TR """' + Watchdog + '"" --config ""' + ConfigFile + '"""';
              Exec(ExpandConstant('{sys}\schtasks.exe'), Params, '', SW_HIDE, ewWaitUntilTerminated, ResultCode);
            end;
          end;
          '@ | Set-Content ClusterForgeRepair.iss
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc ClusterForgeRepair.iss
          if ($LASTEXITCODE -ne 0) { throw 'Repair installer compilation failed.' }

      - name: Package release and checksums
        shell: pwsh
        working-directory: source/phase3-windows-native
        run: |
          $out = 'release/windows-x64'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/windows/bin/Release/clusterforge-worker.exe "$out/ClusterForgeWorker.exe"
          Copy-Item build/windows/bin/Release/clusterforge-watchdog.exe "$out/ClusterForgeWatchdog.exe"
          Copy-Item installer-output/ClusterForge-Phase3-Alpha1-Windows-Repair-Setup.exe $out/
          Get-FileHash "$out/*" -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))"
          } | Set-Content "$out/SHA256.txt"
          Compress-Archive -Path "$out/*" -DestinationPath ClusterForge-Phase3-Alpha1-Windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ClusterForge-Phase3-Alpha1-Windows-x64
          path: source/phase3-windows-native/ClusterForge-Phase3-Alpha1-Windows-x64.zip
          retention-days: 7
