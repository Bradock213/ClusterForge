name: Release ClusterForge Windows Worker

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.2.0-mvp or 1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release-windows-x64:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Validate version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Version must look like 0.2.0-mvp or 1.0.0"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Reconstruct compact source
        shell: pwsh
        run: |
          $parts = Get-ChildItem windows-build/native.part*.txt | Sort-Object Name
          if ($parts.Count -ne 2) { throw "Expected 2 source parts, got $($parts.Count)" }
          $base64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('windows-native.zip', [Convert]::FromBase64String($base64))
          Expand-Archive windows-native.zip -DestinationPath build-src -Force
          if (-not (Test-Path 'build-src/windows-native/CMakeLists.txt')) { throw 'Source reconstruction failed.' }

      - name: Configure and build native Windows x64 EXEs
        shell: pwsh
        run: |
          cmake -S build-src/windows-native -B build/windows-x64 -A x64
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }
          cmake --build build/windows-x64 --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows compilation failed.' }
          $worker = 'build/windows-x64/Release/ClusterForgeWorker.exe'
          $watchdog = 'build/windows-x64/Release/ClusterForgeWatchdog.exe'
          if (-not (Test-Path $worker) -or -not (Test-Path $watchdog)) { throw 'Expected EXEs were not produced.' }

      - name: Smoke test binaries
        shell: pwsh
        run: |
          $worker = Resolve-Path 'build/windows-x64/Release/ClusterForgeWorker.exe'
          $watchdog = Resolve-Path 'build/windows-x64/Release/ClusterForgeWatchdog.exe'
          $w = Start-Process $worker -ArgumentList '--stop' -PassThru -Wait
          if ($w.ExitCode -notin @(0,2)) { throw "Worker smoke test failed: $($w.ExitCode)" }
          $d = Start-Process $watchdog -ArgumentList '--target', 'Z:\definitely-missing.exe', '--delay', '1' -PassThru
          Start-Sleep -Seconds 2
          if ($d.HasExited) { throw "Watchdog exited unexpectedly: $($d.ExitCode)" }
          Stop-Process -Id $d.Id -Force

      - name: Package release and checksums
        shell: pwsh
        run: |
          $out='release/ClusterForge-Windows-Worker-x64'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/windows-x64/Release/ClusterForgeWorker.exe $out/
          Copy-Item build/windows-x64/Release/ClusterForgeWatchdog.exe $out/
          Copy-Item build-src/windows-native/install-worker.ps1 $out/
          Copy-Item build-src/windows-native/uninstall-worker.ps1 $out/
          Copy-Item build-src/windows-native/TESTING.txt $out/

          Get-FileHash "$out/*.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content "$out/SHA256.txt"

          Compress-Archive -Path "$out/*" -DestinationPath ClusterForge-Windows-Worker-x64.zip -Force

          $zipHash = (Get-FileHash 'ClusterForge-Windows-Worker-x64.zip' -Algorithm SHA256).Hash
          "$zipHash  ClusterForge-Windows-Worker-x64.zip" | Set-Content SHA256SUMS.txt

      - name: Generate release page
        shell: pwsh
        run: |
          $body = @"
          # ClusterForge $env:RELEASE_TAG

          Versioned release of the **ClusterForge Windows x86-64 worker/watchdog package**.

          > **Channel:** $([bool]::Parse('${{ inputs.prerelease }}') ? 'Pre-release' : 'Stable release')  
          > **Target:** Windows x86-64  
          > **Build:** GitHub Actions compiled and smoke-tested

          ## Assets

          - `ClusterForge-Windows-Worker-x64.zip` — worker, watchdog, install/uninstall scripts, testing notes and executable hashes
          - `SHA256SUMS.txt` — SHA-256 hash for the downloadable ZIP

          ## Verification

          The workflow reconstructs the native source, compiles both executables, runs smoke tests and creates checksums before publishing this release.

          Verify the downloaded ZIP with:

          ```powershell
          Get-FileHash .\ClusterForge-Windows-Worker-x64.zip -Algorithm SHA256
          ```

          Compare the result with `SHA256SUMS.txt` from this release.

          ## Documentation

          - [Project overview](https://github.com/$env:GITHUB_REPOSITORY#readme)
          - [Architecture](https://github.com/$env:GITHUB_REPOSITORY/blob/main/docs/ARCHITECTURE.md)
          - [Roadmap](https://github.com/$env:GITHUB_REPOSITORY/blob/main/ROADMAP.md)
          - [Changelog](https://github.com/$env:GITHUB_REPOSITORY/blob/main/CHANGELOG.md)
          - [Security policy](https://github.com/$env:GITHUB_REPOSITORY/blob/main/SECURITY.md)
          - [Release policy](https://github.com/$env:GITHUB_REPOSITORY/blob/main/docs/RELEASES.md)

          ## Status

          ClusterForge remains under active development. Pre-release versions may change interfaces, deployment procedures and internal formats.
          "@
          Set-Content -Path RELEASE_BODY.md -Value $body

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $args = @(
            'release', 'create', $env:RELEASE_TAG,
            'ClusterForge-Windows-Worker-x64.zip',
            'SHA256SUMS.txt',
            '--target', $env:GITHUB_SHA,
            '--title', "ClusterForge $env:RELEASE_TAG",
            '--notes-file', 'RELEASE_BODY.md'
          )
          if ('${{ inputs.prerelease }}' -eq 'true') { $args += '--prerelease' }
          gh @args
